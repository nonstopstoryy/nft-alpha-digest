name: NFT Alpha Digest

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run NFT Alpha Digest bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TALENT_WALLET: ${{ secrets.TALENT_WALLET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node bot.js

      - name: Commit and push reports
        run: |
          git config --global user.name "NFT Alpha Bot"
          git config --global user.email "bot@nft-alpha-digest.io"
          git stash
          git pull origin main --rebase
          git stash pop
          git add reports/ LATEST.md
          git diff --staged --quiet || git commit -m "📊 Daily NFT Alpha Report - $(date +%Y-%m-%d)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/nonstopstoryy/nft-alpha-digest.git main
